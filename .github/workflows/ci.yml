# Every pull request and push to main: the Swift test suites, the iPhone, iPad and Watch apps for
# the simulators (unsigned), and the mobile review PNGs as an artifact.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: swift --version && swift test
      - name: Test App Store listing tools (offline)
        run: python3 -I -m unittest discover -s Scripts/tests -v

  mobile:
    name: iPhone, iPad and Watch
    # The image the TestFlight upload builds on (release.yml): Xcode 27, for the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for the simulators
        run: make mobile-build
      - name: Render the review images
        run: make mobile-previews
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-previews
          path: build/previews
