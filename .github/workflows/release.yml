# Builds, signs and notarizes Headroom for a pushed tag `v<version>`, publishes the GitHub release
# and updates the Homebrew cask (ai-headroom in ScaleXY/homebrew-tap) and appcast.xml on main, the
# feed the in-app updater reads.
#
#   Headroom-<version>.dmg (+ .sha256)   drag-to-Applications disk image; what Homebrew installs
#   Headroom-<version>.zip (+ .sha256)   the zipped app that install.sh downloads
#
# To release, tag the commit and push the tag; the version comes from the tag:
#   git tag -a v0.1.2 -m "<release notes>" && git push origin v0.1.2
# Scripts/set-version.sh writes it into the Makefile, Info.plist, man page and CLI for the build.
# An annotated tag's message becomes the release notes; a lightweight tag gets GitHub's generated
# notes. A version with a suffix (-beta.5, -rc.1) is published as a pre-release. If a release for
# the tag already exists (say, a draft with hand-written notes), its assets are replaced instead.
# Generated notes are then rewritten by Claude (release-notes.yml), as are those of a release
# published on github.com.
#
# Secrets (set for the ScaleXY organization):
#   APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64
#       base64 of the "Developer ID Application" certificate and key (.p12)
#   APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD
#       the .p12's export password
#   APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY
#       its name, "Developer ID Application: <name> (<team>)", or SHA-1
#   Notarization uses the App Store Connect API key when it's set, else the Apple ID:
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY          the API key (AuthKey_<id>.p8), as is or base64
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID       that key's ID
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID    the issuer ID shown above the keys in App Store Connect
#   APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID                 an Apple ID on the team
#   APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID_APP_PASSWORD    an app-specific password for it
#   APPLE_DEVELOPER_ACCOUNT_TEAM_ID                        the team ID
#   SPARKLE_ED_PRIVATE_KEY   the EdDSA key that signs in-app updates, as `generate_keys -x` exports it
#                            (its public half is SUPublicEDKey in Packaging/Info.plist). Without it the
#                            release still publishes and the update feed is skipped.
#   HOMEBREW_TAP_TOKEN   token that can push to ScaleXY/homebrew-tap (fine-grained: Contents read
#                        and write on that repository). Without it the release still publishes and
#                        the cask update is skipped.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_sha256: ${{ steps.publish.outputs.dmg_sha256 }}
      generated_notes: ${{ steps.publish.outputs.generated_notes }}
    steps:
      - uses: actions/checkout@v5

      # The tag is the source of truth: its version is written into the checkout before building,
      # so the versions committed in the Makefile and Info.plist don't need bumping first.
      # CFBundleVersion takes this workflow's run number, which only goes up.
      - name: Set the version from the tag
        id: version
        run: |
          version=${TAG#v}
          Scripts/set-version.sh "$version" "${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          swift --version
          make test

      - name: Set up signing and notarization
        env:
          APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY }}
          APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY }}
          APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID }}
          APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID }}
          APPLE_DEVELOPER_ACCOUNT_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_TEAM_ID }}
          APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID_APP_PASSWORD }}
        run: |
          require() {
            local missing="" name
            for name in "$@"; do [ -n "${!name}" ] || missing="$missing $name"; done
            [ -z "$missing" ] && return 0
            echo "::error::Missing secrets:$missing. See the top of .github/workflows/release.yml."
            exit 1
          }
          require APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 \
            APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY
          if [ -n "$APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY" ]; then
            require APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID
          else
            require APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID APPLE_DEVELOPER_ACCOUNT_TEAM_ID APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID_APP_PASSWORD
          fi

          # A throwaway keychain holds the certificate and the notary credentials for this run.
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          # The Developer ID intermediate isn't in an exported .p12, and codesign needs the chain.
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"

          printf '%s' "$APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the existing keychains are one path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # Notarization only accepts Developer ID signatures.
          if ! security find-identity -v -p codesigning "$keychain" | grep -F -- "$APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY" | grep -q "Developer ID Application"; then
            echo "::error::APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY isn't a valid Developer ID Application identity in that .p12."
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi

          if [ -n "$APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            case "$APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY" in
              *"BEGIN PRIVATE KEY"*) printf '%s\n' "$APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY" > "$key" ;;
              *) printf '%s' "$APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY" | base64 --decode > "$key" ;;
            esac
            xcrun notarytool store-credentials headroom-ci --keychain "$keychain" \
              --key "$key" --key-id "$APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID" --issuer "$APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID"
            rm -f "$key"
          else
            xcrun notarytool store-credentials headroom-ci --keychain "$keychain" \
              --apple-id "$APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID" --team-id "$APPLE_DEVELOPER_ACCOUNT_TEAM_ID" --password "$APPLE_DEVELOPER_ACCOUNT_OWNER_APPLE_ID_APP_PASSWORD"
          fi

          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # One make run builds the app once: the DMG is notarized and stapled (the app inside it too),
      # then the zip is made from that stapled app.
      - name: Build, sign and notarize
        env:
          APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY }}
        run: |
          make dmg notarize release IDENTITY="$APPLE_DEVELOPER_ACCOUNT_DEVELOPER_ID_APPLICATION_CERTIFICATE_IDENTITY" \
            NOTARY_PROFILE=headroom-ci NOTARY_KEYCHAIN="$RELEASE_KEYCHAIN"

      - name: Check Gatekeeper accepts the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcrun stapler validate "dist/Headroom-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature --verbose "dist/Headroom-$VERSION.dmg"
          spctl --assess --type execute --verbose build/Headroom.app

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets=(
            "dist/Headroom-$VERSION.dmg" "dist/Headroom-$VERSION.dmg.sha256"
            "dist/Headroom-$VERSION.zip" "dist/Headroom-$VERSION.zip.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=(--verify-tag --title "Headroom $VERSION")
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            # checkout fetches the tagged commit; fetch the tag itself to read an annotated message.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              flags+=(--notes-from-tag)
            else
              flags+=(--generate-notes)
              echo "generated_notes=true" >> "$GITHUB_OUTPUT"
            fi
            gh release create "$TAG" "${assets[@]}" "${flags[@]}"
          fi
          echo "dmg_sha256=$(awk '{print $1}' "dist/Headroom-$VERSION.dmg.sha256")" >> "$GITHUB_OUTPUT"

      # In-app updates: sign the zip for Sparkle and list it in appcast.xml on main, the feed every
      # install checks (SUFeedURL). Pre-releases go in the beta channel (Scripts/appcast.py).
      - name: Publish the update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY isn't set, so the app won't offer $VERSION as an update."
            exit 0
          fi
          if ! plutil -extract SUPublicEDKey raw build/Headroom.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "::error::Packaging/Info.plist has no SUPublicEDKey, so this build can't verify updates."
            exit 1
          fi
          zip="dist/Headroom-$VERSION.zip"
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$zip")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Headroom-$VERSION.zip"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898333+github-actions[bot]@users.noreply.github.com"
          feed="$RUNNER_TEMP/feed"
          # Another push can land on main meanwhile; start again from the new tip.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            rm -rf "$feed" && git worktree prune
            git worktree add --quiet --detach "$feed" origin/main
            python3 -I Scripts/appcast.py "$feed/appcast.xml" "$VERSION" "$BUILD" "$url" "$signature"
            git -C "$feed" add appcast.xml
            git -C "$feed" commit --quiet -m "chore(appcast): Headroom $VERSION"
            if git -C "$feed" push --quiet origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Couldn't push appcast.xml to main."
          exit 1

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -n "${RELEASE_KEYCHAIN:-}" ] && security delete-keychain "$RELEASE_KEYCHAIN" || true

  # A release made here doesn't send a release event (GITHUB_TOKEN's events start no workflows),
  # so generated notes are handed to release-notes.yml directly.
  notes:
    name: Write the release notes
    needs: release
    if: needs.release.outputs.generated_notes == 'true'
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  homebrew:
    name: Update the Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.dmg_sha256 }}
    steps:
      - name: Check for a tap token
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew cask wasn't updated."

      - uses: actions/checkout@v5
        if: env.TAP_TOKEN != ''

      - uses: actions/checkout@v5
        if: env.TAP_TOKEN != ''
        with:
          repository: ScaleXY/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit the cask
        if: env.TAP_TOKEN != ''
        run: |
          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
              -e "s/^  sha256 .*$/  sha256 \"$SHA256\"/" \
              Packaging/ai-headroom.rb > tap/Casks/ai-headroom.rb
          grep -q "version \"$VERSION\"" tap/Casks/ai-headroom.rb && grep -q "sha256 \"$SHA256\"" tap/Casks/ai-headroom.rb
          # The cask was first published as "headroom"; the rename moves those installs over.
          rm -f tap/Casks/headroom.rb
          printf '{\n  "headroom": "ai-headroom"\n}\n' > tap/cask_renames.json

          cd tap
          git add -A Casks cask_renames.json
          if git diff --cached --quiet; then
            echo "The cask is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "ai-headroom $VERSION"
          git push
