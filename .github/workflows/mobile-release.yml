# Builds Headroom for iPhone, iPad and Apple Watch for a pushed tag `mobile-v<version>` and uploads
# it to App Store Connect (TestFlight). Submission for review stays a manual step in App Store Connect.
#
#   git tag -a mobile-v1.0.0 -m "<what's new>" && git push origin mobile-v1.0.0
#
# Scripts/set-version.sh --mobile stamps the version; the build number is this workflow's run number.
# Signing is manual, with App Store distribution profiles, so no registered devices are needed.
# Secrets:
#   APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64     base64 of the Apple Distribution certificate and key (.p12)
#   APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD       the .p12's export password
#   APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_IOS_APP_STORE_BASE64                   App Store profile, com.scalexy.headroom
#   APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_MOBILE_WIDGETS_APP_STORE_BASE64        App Store profile, com.scalexy.headroom.mobile-widgets
#   APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_WATCHKITAPP_APP_STORE_BASE64           App Store profile, com.scalexy.headroom.watchkitapp
#   APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_WATCHKITAPP_WIDGETS_APP_STORE_BASE64   App Store profile, com.scalexy.headroom.watchkitapp.widgets
#   APPLE_DEVELOPER_ACCOUNT_TEAM_ID                        the team ID
# The upload uses the App Store Connect API key the Mac release already has:
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY          the API key (AuthKey_<id>.p8), as is or base64
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID       that key's ID
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID    the issuer ID
# Profiles expire after a year, and must be regenerated whenever an App ID's capabilities change.
# Before the first upload: register the App IDs, the iCloud container iCloud.com.scalexy.headroom
# and the App Group group.com.scalexy.headroom, and deploy the CloudKit schema to Production
# (plans/ios-app/07-build-release-qa.md §6).

name: Mobile Release

on:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Set the version from the tag
        run: Scripts/set-version.sh --mobile "${TAG#mobile-v}" "${{ github.run_number }}"

      - name: Test
        run: swift test

      - name: Generate the project
        run: brew install xcodegen && make mobile-project

      - name: Install the distribution certificate and profiles
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_APP: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_IOS_APP_STORE_BASE64 }}
          PROFILE_WIDGETS: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_MOBILE_WIDGETS_APP_STORE_BASE64 }}
          PROFILE_WATCH: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_WATCHKITAPP_APP_STORE_BASE64 }}
          PROFILE_WATCH_WIDGETS: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_HEADROOM_WATCHKITAPP_WIDGETS_APP_STORE_BASE64 }}
        run: |
          for name in P12 P12_PASSWORD PROFILE_APP PROFILE_WIDGETS PROFILE_WATCH PROFILE_WATCH_WIDGETS; do
            [ -n "${!name}" ] || { echo "::error::Missing secret for $name. See the top of this workflow."; exit 1; }
          done

          # A throwaway keychain with the Apple Distribution identity and its intermediate.
          keychain="$RUNNER_TEMP/mobile.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the existing keychains are one path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution" \
            || { echo "::error::The .p12 holds no Apple Distribution identity."; exit 1; }

          # Profiles go where Xcode looks for them; their names select them per target.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
          done
          for var in PROFILE_APP PROFILE_WIDGETS PROFILE_WATCH PROFILE_WATCH_WIDGETS; do
            file="$RUNNER_TEMP/$var.mobileprovision"
            printf '%s' "${!var}" | base64 --decode > "$file"
            plist=$(security cms -D -i "$file")
            uuid=$(plutil -extract UUID raw -o - - <<< "$plist")
            name=$(plutil -extract Name raw -o - - <<< "$plist")
            app_id=$(plutil -extract Entitlements.application-identifier raw -o - - <<< "$plist")
            if plutil -extract ProvisionedDevices xml1 -o /dev/null - <<< "$plist" 2>/dev/null; then
              echo "::error::$var is a development or ad hoc profile ($name). Use an App Store profile."; exit 1
            fi
            cp "$file" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            cp "$file" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            echo "HEADROOM_$var=$name" >> "$GITHUB_ENV"
            echo "$var: $name ($app_id)"
          done

      - name: Archive and upload
        env:
          KEY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_TEAM_ID }}
        run: |
          for name in KEY KEY_ID ISSUER_ID TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::Missing the App Store Connect or team ID secrets. See the top of this workflow."; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey.p8"
          case "$KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$KEY" > "$key" ;;
            *) printf '%s' "$KEY" | base64 --decode > "$key" ;;
          esac
          auth=(-authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")

          xcodebuild archive -project Mobile/Headroom.xcodeproj -scheme Headroom -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Headroom.xcarchive \
            HEADROOM_TEAM_ID="$TEAM_ID" HEADROOM_CLOUDKIT=YES \
            HEADROOM_PROFILE_APP="$HEADROOM_PROFILE_APP" HEADROOM_PROFILE_WIDGETS="$HEADROOM_PROFILE_WIDGETS" \
            HEADROOM_PROFILE_WATCH="$HEADROOM_PROFILE_WATCH" HEADROOM_PROFILE_WATCH_WIDGETS="$HEADROOM_PROFILE_WATCH_WIDGETS"

          export_options="$RUNNER_TEMP/ExportOptions.plist"
          buddy() { /usr/libexec/PlistBuddy -c "$1" "$export_options" >/dev/null; }
          buddy "Add :method string app-store-connect"
          buddy "Add :destination string upload"
          buddy "Add :teamID string $TEAM_ID"
          buddy "Add :signingStyle string manual"
          buddy "Add :signingCertificate string Apple Distribution"
          buddy "Add :provisioningProfiles dict"
          buddy "Add :provisioningProfiles:com.scalexy.headroom string $HEADROOM_PROFILE_APP"
          buddy "Add :provisioningProfiles:com.scalexy.headroom.mobile-widgets string $HEADROOM_PROFILE_WIDGETS"
          buddy "Add :provisioningProfiles:com.scalexy.headroom.watchkitapp string $HEADROOM_PROFILE_WATCH"
          buddy "Add :provisioningProfiles:com.scalexy.headroom.watchkitapp.widgets string $HEADROOM_PROFILE_WATCH_WIDGETS"
          xcodebuild -exportArchive -archivePath build/Headroom.xcarchive -exportOptionsPlist "$export_options" \
            -exportPath build/export "${auth[@]}"
          rm -f "$key"
